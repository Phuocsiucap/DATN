services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialcontent
    ports:
      - "5432:5432"
    volumes:
      - socialcontent_postgres:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - socialcontent_mongo:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/api-service/Dockerfile
    working_dir: /app/services/api-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - mongodb
      - kafka
      - embedding-service
      - ai-media-planning-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_SERVICE_URL: http://embedding-service:8075
    ports:
      - "8000:8000"
    volumes:
      - ./data_demo/video_gen_demo/public:/app/data_demo/video_gen_demo/public
      - ./data_demo/video_gen_demo/out:/app/data_demo/video_gen_demo/out

  data-ingestion-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/data-ingestion-engine/Dockerfile
    working_dir: /app/services/data-ingestion-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONUNBUFFERED: "1"

  embedding-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/embedding-service/Dockerfile
    working_dir: /app/services/embedding-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8075
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_MODEL_NAME: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "512"
      EMBEDDING_BATCH_SIZE: "64"
      PYTHONUNBUFFERED: "1"
      ENABLE_WORKERS: "true"
    ports:
      - "8075:8075"

  ai-media-planning-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/ai-media-engine/Dockerfile
    working_dir: /app/services/ai-media-engine
    command: uvicorn app.planning.main:app --host 0.0.0.0 --port 8050
    depends_on:
      - postgres
      - mongodb
      - kafka
      - embedding-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_SERVICE_URL: http://embedding-service:8075
      EMBEDDING_MODEL_NAME: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "512"
      EMBEDDING_BATCH_SIZE: "64"
      PYTHONUNBUFFERED: "1"
      ENABLE_WORKERS: "true"

  ai-media-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/ai-media-engine/Dockerfile
    working_dir: /app/services/ai-media-engine
    command: python -m app.video.workers.generate_video_worker
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_SERVICE_URL: http://embedding-service:8075
      GENERATE_VIDEO_DISABLE_RENDER: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data_demo/video_gen_demo/public:/app/data_demo/video_gen_demo/public

  remotion-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/remotion-worker/Dockerfile
    working_dir: /app
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1536m
    shm_size: '1gb'
    command: node src/worker.mjs
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialcontent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHROME_BIN: /usr/bin/chromium
      REMOTION_PUBLIC_DIR: /app/data_demo/video_gen_demo/public
      REMOTION_OUT_DIR: /app/data_demo/video_gen_demo/out
      GENERATE_VIDEO_REMOTION_CONCURRENCY: "1"
      REMOTION_RENDER_TIMEOUT_MS: "1800000"
    volumes:
      - ./data_demo/video_gen_demo/public:/app/data_demo/video_gen_demo/public
      - ./data_demo/video_gen_demo/out:/app/data_demo/video_gen_demo/out

volumes:
  socialcontent_postgres:
  socialcontent_mongo:

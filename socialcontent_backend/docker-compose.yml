services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialcontent
    ports:
      - "5432:5432"
    volumes:
      - socialcontent_postgres:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - socialcontent_mongo:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/api-service/Dockerfile
    working_dir: /app/services/api-service
    command: xvfb-run -a uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - mongodb
      - kafka
      - embedding-service
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BROWSER_HEADLESS: "false"
      EMBEDDING_SERVICE_URL: http://embedding-service:8060
    ports:
      - "8000:8000"
    volumes:
      - socialcontent_social_profile:/app/social_profile

  embedding-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/embedding-service/Dockerfile
      args:
        PRELOAD_FASTEMBED: ${PRELOAD_FASTEMBED:-true}
        FASTEMBED_MODEL_NAME: ${FASTEMBED_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8060
    env_file:
      - ../.env
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-512}
      FASTEMBED_MODEL_NAME: ${FASTEMBED_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      FASTEMBED_THREADS: ${FASTEMBED_THREADS:-2}
    ports:
      - "8060:8060"

  crawl-orchestrator:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/crawl-orchestrator/Dockerfile
    working_dir: /app/services/crawl-orchestrator
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    depends_on:
      - api-service
      - kafka
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8010:8010"

  planning-orchestrator:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/planning-orchestrator/Dockerfile
    working_dir: /app/services/planning-orchestrator
    command: uvicorn app.main:app --host 0.0.0.0 --port 8050
    depends_on:
      - api-service
      - mongodb
      - kafka
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8050:8050"

  crawler-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/crawler-service/Dockerfile
    working_dir: /app/services/crawler-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8020:8020"

  normalization-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/normalization-service/Dockerfile
    working_dir: /app/services/normalization-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8030
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8030:8030"

  story-processing-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/story-processing-service/Dockerfile
    working_dir: /app/services/story-processing-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8040
    depends_on:
      - postgres
      - mongodb
      - kafka
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8040:8040"

volumes:
  socialcontent_postgres:
  socialcontent_mongo:
  socialcontent_social_profile:

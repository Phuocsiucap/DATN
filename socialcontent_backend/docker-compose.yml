services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialcontent
    ports:
      - "5432:5432"
    volumes:
      - socialcontent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialcontent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - socialcontent_mongo:/data/db

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_AUTH_DATABASE: socialcontent

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - socialcontent_zookeeper_data:/var/lib/zookeeper/data
      - socialcontent_zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-service:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/api-service/Dockerfile
    working_dir: /app/services/api-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      data-ingestion-worker:
        condition: service_started
      ai-media-engine:
        condition: service_started
      remotion-worker:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_SERVICE_URL: http://data-ingestion-worker:8010
      DATA_INGESTION_SERVICE_URL: http://data-ingestion-worker:8010
      PLANNING_SERVICE_URL: http://ai-media-planning-worker:8050
      AI_MEDIA_WORKER_URL: http://ai-media-worker:8060
      REMOTION_WORKER_URL: http://remotion-worker:8090
      VIDEO_STORAGE_ROOT: /app/runtime/video-generation
    ports:
      - "8000:8000"
    volumes:
      - ./runtime/video-generation:/app/runtime/video-generation
      - ../tiktok_affiliate_studio/assets:/tiktok_affiliate_studio/assets:ro
      - ../tiktok_affiliate_studio/feeds:/tiktok_affiliate_studio/feeds:ro
      - ../tiktok_affiliate_studio/output:/tiktok_affiliate_studio/output

  data-ingestion-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/data-ingestion-engine/Dockerfile
    working_dir: /app/services/data-ingestion-engine
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_MODEL_NAME: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "512"
      EMBEDDING_BATCH_SIZE: "64"
      PYTHONUNBUFFERED: "1"

  ai-media-engine:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/ai-media-engine/Dockerfile
    working_dir: /app/services/ai-media-engine
    command: uvicorn app.entrypoints.main:app --host 0.0.0.0 --port 8050
    ports:
      - "127.0.0.1:8050:8050"
      - "127.0.0.1:8060:8060"
      - "127.0.0.1:8061:8061"
    networks:
      default:
        aliases:
          - ai-media-planning-worker
          - ai-media-worker
          - ai-media-ocr-worker
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      data-ingestion-worker:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/socialcontent
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EMBEDDING_SERVICE_URL: http://data-ingestion-worker:8010
      EMBEDDING_MODEL_NAME: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "512"
      EMBEDDING_BATCH_SIZE: "64"
      GENERATE_VIDEO_DISABLE_RENDER: "true"
      GENERATE_VIDEO_WORKER_TASK_TYPES: GENERATE_VIDEO_SCRIPT,GENERATE_VIDEO_EDIT,GENERATE_VIDEO_REVIEW,GENERATE_VIDEO_VOICE
      VIDEO_STORAGE_ROOT: /app/runtime/video-generation
      BILIBILI_OCR_WORKER_GROUP_ID: bilibili-ocr-workers
      BILIBILI_HARDSUB_OCR_ENABLED: "true"
      BILIBILI_HARDSUB_OCR_FPS: "1.0"
      BILIBILI_HARDSUB_OCR_WORKERS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BILIBILI_HARDSUB_OCR_MAX_SECONDS: "360"
      PYTHONUNBUFFERED: "1"
      ENABLE_WORKERS: "true"
    volumes:
      - ./runtime/video-generation:/app/runtime/video-generation

  remotion-worker:
    build:
      context: ..
      dockerfile: socialcontent_backend/services/remotion-worker/Dockerfile
    working_dir: /app
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 1536m
    shm_size: '1gb'
    command: node src/worker.mjs
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialcontent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHROME_BIN: /usr/bin/chromium
      VIDEO_STORAGE_ROOT: /app/runtime/video-generation
      GENERATE_VIDEO_REMOTION_CONCURRENCY: "1"
      REMOTION_RENDER_TIMEOUT_MS: "1800000"
      HEALTH_PORT: "8090"
    volumes:
      - ./runtime/video-generation:/app/runtime/video-generation

volumes:
  socialcontent_postgres:
  socialcontent_mongo:
  socialcontent_zookeeper_data:
    external: true
    name: 95ee9a291f921969b5531829802239458e54117d0ad2418fdc9c72ed18b832ce
  socialcontent_zookeeper_log:
    external: true
    name: ea7f664875728ab42744bb5e1fb2d3bff4cc4355abedacdf55ef0d80a892e58b
